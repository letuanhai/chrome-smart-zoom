<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            width: 320px;
            background: white;
        }
        .header {
            background: #4CAF50;
            color: white;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
        }
        .content {
            padding: 16px;
        }
        .option-group {
            margin-bottom: 8px;
        }
        .option-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 14px;
        }
        .radio-option {
            display: flex;
            align-items: flex-start;
            margin: 8px 0;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .radio-option:hover {
            border-color: #4CAF50;
            background: #f8fff8;
        }
        .radio-option.selected {
            border-color: #4CAF50;
            background: #f0f8f0;
        }
        .radio-option input {
            margin-right: 10px;
            margin-top: 2px;
        }
        .radio-content {
            flex: 1;
        }
        .radio-title {
            font-weight: 500;
            color: #333;
            font-size: 13px;
            margin-bottom: 2px;
        }
        .radio-description {
            font-size: 12px;
            color: #666;
            line-height: 1.3;
        }
        .padding-group {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
        }
        .padding-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            margin-top: 4px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .padding-hint {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">SmartZoom Settings</div>
    <div class="content">
        <div class="option-group">
            <label>Choose zoom trigger:</label>
            
            <div class="radio-option" id="option-right">
                <input type="radio" name="trigger" value="right" id="trigger-right">
                <div class="radio-content">
                    <div class="radio-title">Double Right-Click</div>
                    <div class="radio-description">Double-click right button to zoom. Context menu appears on single clicks.</div>
                </div>
            </div>
            
            <div class="radio-option" id="option-middle">
                <input type="radio" name="trigger" value="middle" id="trigger-middle">
                <div class="radio-content">
                    <div class="radio-title">Double Middle-Click</div>
                    <div class="radio-description">Double-click scroll wheel button to zoom. No context menu interference.</div>
                </div>
            </div>
        </div>
        
        <div class="option-group padding-group">
            <label for="padding">Zoom padding (px)</label>
            <input type="number" id="padding" min="0" max="500" value="20" placeholder="20">
            <div class="padding-hint">Space around the zoomed element (0-500px)</div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
